[package]
name = "readings-window"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Read-only, token-protected HTTPS window onto the Spark's GPU/CPU readings"

[dependencies]
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
